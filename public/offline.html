<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>RADARCharts by REM — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #050505; color: #f5f5f5; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 15%, rgba(255,255,255,.12), transparent 42%), #050505; }
      main { width: min(100%, 540px); box-sizing: border-box; padding: 32px; border: 1px solid rgba(255,255,255,.18); border-radius: 28px; background: rgba(255,255,255,.08); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 24px 80px rgba(0,0,0,.36); backdrop-filter: blur(18px); text-align: center; }
      p { color: rgba(255,255,255,.68); line-height: 1.6; }
      button { border: 1px solid rgba(255,255,255,.24); border-radius: 999px; padding: 12px 18px; background: #fff; color: #050505; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <strong>RADARCharts by REM</strong>
      <h1>You are temporarily offline.</h1>
      <p>The app shell is available, but this page needs a connection to load its latest Framer and WordPress content.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
